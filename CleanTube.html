<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanTube</title>
    <style>

        *{
            background-color: #17171d;
            margin: 0px;
            padding: 0px;
            text-align: center;
        }
        h1{
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-size: 10ch;
            color: transparent;
            background-clip: text;
            background-image: linear-gradient(to top,#ec12cf,#720699);
            border-bottom: 1px solid white;
        }
        h2{
            color: #ffffff;            
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%,-50%);
            font-family: 'Times New Roman', Times, serif;
            font-size: 4ch;
        }

    </style>
</head>
<body>
    <!-- <h1>CleanTube</h1> -->
    <h2 id="Warn">Sorry, but this site has been blocked to help you avoid wasting time on Irrelevant things. We recommend you watch videos on YouTube if you have nothing to do or watch a series / movie</h2>
</body>
